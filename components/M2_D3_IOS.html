<section class="documents-section">

    <div class="documents-header">
      <h1 data-key="implementationSchemes">Implementation of Schemes</h1>

      <p data-key="documentsDescription">
        Browse and download official documents.
      </p>
    </div>

    <!-- Toolbar -->

    <div class="documents-toolbar">
      <input
        type="text"
        id="searchDocuments"
        placeholder="Search documents..."

      <select id="sortDocuments">
        <option value="latest" data-key="latestFirst">Latest First</option>

        <option value="oldest" data-key="oldestFirst">Oldest First</option>
      </select>
    </div>

    <!-- First Section -->

    <div class="document-group">
      <h2 class="group-title" data-key="schemeDocuments">Scheme Documents</h2>

      <div class="documents-list" id="schemeDocuments"></div>
    </div>

    <!-- Second Section -->

    <div class="document-group">
      <h2 class="group-title" data-key="dprMaharashtraAgniSurakshaAbhiyan">
        DPR Maharashtra Agni Suraksha Abhiyan
      </h2>

      <div class="documents-list" id="dprDocuments"></div>
    </div>
  </div>
</section>
