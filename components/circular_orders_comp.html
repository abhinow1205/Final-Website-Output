<section class="documents-section">
  <div class="documents-container">
    <div class="documents-header">
      <h2 data-key="circularOrdersHeading">Circulars & Office Orders</h2>

      <p data-key="circulardocumentsSubtitle">
        Browse and download official documents.
      </p>
    </div>

    <!-- FILTER BAR -->

    <div class="documents-toolbar">
      <input
        type="text"
        id="searchDocuments"
        placeholder="Search documents..."
      />

      <select id="categoryFilter">
        <option value="all" data-key="langDropdown">Language</option>
      </select>

      <select id="sortDocuments">
        <option value="latest" data-key="latestFirst">Latest First</option>

        <option value="oldest" data-key="oldestFirst">Oldest First</option>
      </select>
    </div>

    <!-- DOCUMENT LIST -->

    <div class="documents-list" id="documentsList">
      <!-- Loaded dynamically -->
    </div>
  </div>
</section>
