<section class="documents-section">
  <div class="documents-container">
    <div class="documents-header">
      <h1 data-key="listLicenseAgencies">List of License Agencies</h1>

      <p data-key="licenseAgenciesSubtitle">
        Browse and download official license agency documents.
      </p>
    </div>

    <!-- Toolbar -->

    <div class="documents-toolbar">
      <input
        type="text"
        id="searchDocuments"
        placeholder="Search documents..."
      />

      <select id="sortDocuments">
        <option data-key="latestFirst" value="latest">Latest First</option>

        <option data-key="oldestFirst" value="oldest">Oldest First</option>
      </select>
    </div>

    <!-- First Section -->

    <div class="document-group">
      <h2 data-key="documentList" class="group-title">Documents</h2>

      <div class="documents-list" id="schemeDocuments"></div>
    </div>

    <!-- Second Section -->

    <div class="document-group">
      <!-- <h2 class="group-title">Millennium City Mitigation Plan</h2> -->

      <div class="documents-list" id="dprDocuments"></div>
    </div>
  </div>
</section>
