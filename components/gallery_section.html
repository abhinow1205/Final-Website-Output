<!-- ========================= -->
<!-- ===== MEDIA GALLERY ===== -->
<!-- ========================= -->

<section class="mediaGallery">
  <!-- TOP BAR -->

  <div class="galleryTop">
    <div class="galleryHeading">
      <h2>Media Gallery</h2>
    </div>

    <div class="galleryControls">
      <button class="seeAllBtn">See All</button>

      <button class="galleryArrow leftArrow">&#10094;</button>

      <button class="galleryArrow rightArrow">&#10095;</button>
    </div>
  </div>

  <!-- GALLERY -->

  <div class="galleryWrapper">
    <div class="galleryTrack">
      <!-- IMAGE CARD -->

      <div class="galleryCard imageCard">
        <img
          src="https://images.unsplash.com/photo-1614338577234-8747c0b37571?w=800"
          alt=""
        />

        <div
          class="galleryOverlay viewImage"
          data-image="https://images.unsplash.com/photo-1552244935-439697eea0bd?w=1200"
        >
          <span>View Image</span>
        </div>
      </div>

      <!-- VIDEO CARD -->

      <div class="galleryCard videoCard">
        <img
          src="https://images.unsplash.com/photo-1700794871938-36fff73892a4?w=800"
          alt=""
        />

        <div
          class="playButton playVideo"
          data-video="https://www.w3schools.com/html/mov_bbb.mp4"
        >
          ▶
        </div>
      </div>

      <!-- IMAGE CARD -->

      <div class="galleryCard imageCard">
        <img
          src="https://plus.unsplash.com/premium_photo-1683133357376-ee581f35158c?w=800"
          alt=""
        />

        <div
          class="galleryOverlay viewImage"
          data-image="https://images.unsplash.com/photo-1642541400994-5bf3c9c0a8d9?w=1200"
        >
          <span>View Image</span>
        </div>
      </div>

      <!-- VIDEO CARD -->

      <div class="galleryCard videoCard">
        <img
          src="https://images.unsplash.com/photo-1642323673567-bf38f693950b?w=800"
          alt=""
        />

        <div
          class="playButton playVideo"
          data-video="https://www.w3schools.com/html/movie.mp4"
        >
          ▶
        </div>
      </div>

      <!-- IMAGE CARD -->

      <div class="galleryCard imageCard">
        <img
          src="https://images.unsplash.com/photo-1731842353630-7fe8582bb031?w=800"
          alt=""
        />

        <div
          class="galleryOverlay viewImage"
          data-image="https://images.unsplash.com/photo-1731842353630-7fe8582bb031?w=1200"
        >
          <span>View Image</span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ========================= -->
<!-- ===== IMAGE MODAL ====== -->
<!-- ========================= -->

<div class="imageModal">
  <span class="closeImageModal"> &times; </span>

  <img class="modalImage" src="" alt="" />
</div>

<!-- ========================= -->
<!-- ===== VIDEO MODAL ====== -->
<!-- ========================= -->

<div class="videoModal">
  <span class="closeVideoModal"> &times; </span>

  <video class="modalVideo" controls autoplay>
    <source src="" type="video/mp4" />
  </video>
</div>
